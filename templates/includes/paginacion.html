{% load core_tags %}{% if pagina.has_other_pages %}
<nav class="mt-3 no-imprimir">
  <ul class="pagination pagination-sm justify-content-center mb-0">
    {% if pagina.has_previous %}<li class="page-item"><a class="page-link" href="?{% query_con pagina=pagina.previous_page_number %}">Anterior</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}<li class="page-item"><a class="page-link" href="?{% query_con pagina=pagina.next_page_number %}">Siguiente</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
