{% extends "registration/_publico.html" %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block caja %}
<p class="small text-muted">Escribí tu email y te mandamos un enlace para elegir una contraseña nueva.</p>
<form method="post">
  {% csrf_token %}
  {% include "includes/campo.html" with campo=form.email %}
  <button class="btn btn-dark w-100">Enviar enlace</button>
  <div class="text-center mt-3"><a href="{% url 'login' %}" class="small">Volver a ingresar</a></div>
</form>
{% endblock %}
